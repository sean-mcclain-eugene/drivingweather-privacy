<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    <!-- Custom layout: Minimal theme styling without the GitHub project link or the maintainer footer. -->
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1>Driving Weather</h1>
        <p>{{ site.description }}</p>
        <p>Developer: Sean McClain<br>
        <a href="mailto:mcclain.sean.appdev@gmail.com">mcclain.sean.appdev@gmail.com</a></p>
      </header>
      <section>
        {{ content }}
      </section>
      <footer>
        <p><small>Theme based on Minimal by orderedlist.</small></p>
      </footer>
    </div>
  </body>
</html>
